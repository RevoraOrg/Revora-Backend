name: Stryker Mutation Testing

on:
  pull_request:
    paths:
      - 'src/lib/jwt.ts'
      - 'src/lib/webhookSignature.ts'
      - 'src/middleware/webhookAuth.ts'
      - 'src/services/distributionEngine.ts'
      - 'src/services/revenueReconciliationService.ts'
      - 'src/services/payoutDriftDetector.ts'

jobs:
  mutation-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm ci

    - name: Run Stryker mutation testing
      run: npx stryker run --concurrency 2 --timeoutMS 60000
