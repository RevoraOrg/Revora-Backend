name: Audit Log Integrity Verification

on:
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  verify-audit-integrity:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: revora
          POSTGRES_PASSWORD: revora
          POSTGRES_DB: revora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revora -d revora_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://revora:revora@localhost:5432/revora_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --omit=optional

      - name: Apply migrations
        run: npm run migrate

      - name: Run audit integrity unit tests
        run: npm run test:audit-integrity

      - name: Run audit integrity CLI verification
        run: npm run verify-audit-integrity
